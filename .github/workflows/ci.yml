# Proves this repository does what its README says, from a clean checkout.
#
# Two jobs on purpose. `test` is offline and deterministic — no network, no key,
# no funds — so it is the one the badge tracks. `sandbox` downloads a real NEAR
# node and fills a mandate against it, which is slower and depends on a release
# download, so it runs beside rather than inside the fast job.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: tests — offline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: contract — 32 unit tests
        run: cargo test --lib

      - name: client — 54 assertions
        run: npm --prefix client ci && npm --prefix client test

      - name: frontend — 99 tests
        run: npm --prefix frontend ci && npm --prefix frontend test

      - name: frontend — typechecks and builds
        run: npm --prefix frontend run build

      - name: every claim the site makes, re-derived from source and chain
        run: python3 frontend/tools/check.py

      - name: no signed quote is ever hand-typed
        run: python3 frontend/tools/mkfixtures.py --check

  sandbox:
    name: tests — against a real NEAR node
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # The suite deploys real wasm into a real node, so it has to exist first.
      # build.sh pins rustc 1.86 because nearcore's VM rejects anything newer
      # (ARCHITECTURE.md §3.14) — the same build a human runs before deploying.
      # `curl … | sh` hides a download failure, because the pipeline exits with
      # sh's status and sh is happy with empty input. The release CDN answered
      # 504 once already, so: retry, fall back to building it, then prove the
      # command actually exists before anything depends on it.
      # cargo-near pulls in hidapi for Ledger support, which needs libudev.
      # GitHub runners do not ship it, so the source fallback cannot build
      # without this.
      - name: system deps for the source fallback
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libudev-dev pkg-config

      - name: install cargo-near
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if curl --proto '=https' --tlsv1.2 -LsSf --retry 3 --retry-delay 5 \
                 https://github.com/near/cargo-near/releases/latest/download/cargo-near-installer.sh \
                 -o /tmp/cargo-near-installer.sh; then
              sh /tmp/cargo-near-installer.sh && break
            fi
            echo "attempt $attempt failed, retrying"; sleep 10
          done
          command -v cargo-near >/dev/null || cargo install cargo-near --locked
          cargo near --version

      - name: build the deployable wasm
        run: ./build.sh

      - name: contract — 28 integration tests, nothing mocked
        run: cargo test --test integration
